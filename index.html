<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#197b46"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Lingala na Lingala</title><style>body{margin:0;background:#f1f7f2;color:#19392a;font:17px system-ui}main{max-width:560px;margin:auto;padding:20px}h1{color:#197b46;margin-bottom:4px}small{color:#526b5c}section{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #163c1710}button,input{font:inherit;box-sizing:border-box}button{width:100%;padding:14px;border:2px solid #d5e5d8;background:white;border-radius:13px;margin:6px 0;text-align:left;color:inherit;cursor:pointer}button.primary{background:#197b46;color:white;text-align:center;border-color:#197b46;font-weight:bold}button:disabled{opacity:.55}progress{width:100%;accent-color:#197b46}input{width:100%;padding:14px;border:2px solid #d5e5d8;border-radius:12px}.good{color:#197b46}.bad{color:#a52e28}.big{font-size:30px;font-weight:bold}.stats{padding:12px 0} .chip{display:inline-block;width:auto;margin:4px;padding:10px} .listen{color:#197b46;background:#edf8ef;font-size:15px}#audioNotice{font-size:14px;color:#526b5c}</style><main><h1>Lingala na Lingala</h1><small>Kinshasa · Nederlands · Absolute beginner · v0.4</small><div class="stats" id="stats"></div><div id="app"></div></main><script>const L=[{"title": "Begroeten", "note": "In Kinshasa hoor je ook vaak het Franse bonjour en merci.", "words": [["Mbote", "Hallo"], ["Sango nini?", "Hoe gaat het?"], ["Malamu", "Goed"], ["Matondi", "Bedankt"], ["Tokomonana", "Tot ziens"]]}, {"title": "Jezelf voorstellen", "note": "Na ngai betekent mijn; na yo betekent jouw.", "words": [["Ngai", "Ik"], ["Yo", "Jij"], ["Kombo", "Naam"], ["Kombo na ngai", "Mijn naam"], ["Kombo na yo nani?", "Hoe heet je?"]]}, {"title": "Ja en nee", "note": "Te achter een werkwoord maakt de zin ontkennend.", "words": [["Ee", "Ja"], ["Te", "Nee"], ["Nayebi", "Ik weet het"], ["Nayebi te", "Ik weet het niet"], ["Nasosoli te", "Ik begrijp het niet"]]}, {"title": "Familie", "note": "Ndeko kan ook een familielid of een vertrouwde aanspreking zijn.", "words": [["Mama", "Moeder"], ["Tata", "Vader"], ["Mwana", "Kind"], ["Ndeko", "Broer of zus"], ["Libota", "Familie"]]}, {"title": "Eten en drinken", "note": "Ko- is een veelvoorkomend voorvoegsel bij infinitieven.", "words": [["Mai", "Water"], ["Bilei", "Eten"], ["Kolya", "Eten (werkwoord)"], ["Komela", "Drinken"], ["Nazali na nzala", "Ik heb honger"]]}, {"title": "Beleefd zijn", "note": "Merci wordt in Kinshasa veel gebruikt naast matondi.", "words": [["Limbisa ngai", "Vergeef me"], ["Matondi mingi", "Heel erg bedankt"], ["Nalingi yo", "Ik hou van jou"], ["Yaka", "Kom"], ["Kende", "Ga"]]}, {"title": "Getallen 1–5", "note": "Oefen deze getallen hardop.", "words": [["Moko", "Een"], ["Mibale", "Twee"], ["Misato", "Drie"], ["Minei", "Vier"], ["Mitano", "Vijf"]]}, {"title": "Getallen 6–10", "note": "Herhaal ook de getallen uit de vorige les.", "words": [["Motoba", "Zes"], ["Sambo", "Zeven"], ["Mwambe", "Acht"], ["Libwa", "Negen"], ["Zomi", "Tien"]]}, {"title": "Vragen", "note": "Nini betekent wat, nani betekent wie.", "words": [["Nini?", "Wat?"], ["Nani?", "Wie?"], ["Wapi?", "Waar?"], ["Ntango nini?", "Wanneer?"], ["Mpo na nini?", "Waarom?"]]}, {"title": "Thuis", "note": "Na kan onder meer in, op, bij of met betekenen.", "words": [["Ndako", "Huis"], ["Mbeto", "Bed"], ["Ekuke", "Deur"], ["Kiti", "Stoel"], ["Mesa", "Tafel"]]}, {"title": "Werkwoorden", "note": "Na- verwijst hier naar ik, o- naar jij.", "words": [["Nazali", "Ik ben"], ["Ozali", "Jij bent"], ["Nalingi", "Ik wil"], ["Olingi", "Jij wil"], ["Nakeyi", "Ik ben vertrokken"]]}, {"title": "Dagelijks gesprek", "note": "Oefen de zinnen als geheel, niet alleen losse woorden.", "words": [["Ozali malamu?", "Gaat het goed met jou?"], ["Nazali malamu", "Het gaat goed met mij"], ["Ozali wapi?", "Waar ben je?"], ["Nazali na ndako", "Ik ben thuis"], ["Butu malamu", "Goedenacht"]]}];let state={xp:0,done:[],weak:{},sound:true,auto:true,slow:false};try{Object.assign(state,JSON.parse(localStorage.getItem('lingala-v2')||'{}'))}catch(e){}const app=document.getElementById('app');let queue=[],pos=0,lesson=-1,locked=false,chosen=[];function save(){try{localStorage.setItem('lingala-v2',JSON.stringify(state))}catch(e){}stats()}function stats(){document.getElementById('stats').textContent='⚡ '+state.xp+' XP  ·  '+state.done.length+'/'+L.length+' lessen voltooid'}function btn(t,f,primary=false){let b=document.createElement('button');b.textContent=t;if(primary)b.className='primary';b.onclick=f;app.querySelector('section').append(b);return b}function panel(h,body=''){app.innerHTML='<section><h2>'+h+'</h2>'+body+'</section>'}let audioCtx;function unlock(){try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume().catch(()=>{})}catch(e){}}document.addEventListener('pointerdown',unlock);document.addEventListener('keydown',unlock);function tone(ok){if(!state.sound)return;unlock();if(!audioCtx)return;let t=audioCtx.currentTime; (ok?[523.25,659.25,783.99]:[330,247]).forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),a=t+i*.105;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,a);g.gain.exponentialRampToValueAtTime(.12,a+.015);g.gain.exponentialRampToValueAtTime(.001,a+.18);o.connect(g);g.connect(audioCtx.destination);o.start(a);o.stop(a+.19)})}function voice(){return window.speechSynthesis?.getVoices().find(v=>/^ln(?:[-_]|$)/i.test(v.lang))}let player;function speak(word,notice=true){if(player){player.pause();player=null}window.speechSynthesis?.cancel();let v=voice();if(v){let u=new SpeechSynthesisUtterance(word);u.voice=v;u.lang=v.lang;u.rate=state.slow?.72:1;u.onerror=()=>{if(notice)audioNotice('Uitspraak kon niet worden afgespeeld.')};speechSynthesis.speak(u);return}if(notice)audioNotice('Geen Lingala-stem beschikbaar op dit toestel. Er wordt bewust geen Franse stem gebruikt.')}function audioNotice(t){let n=document.getElementById('audioNotice');if(!n){n=document.createElement('p');n.id='audioNotice';n.setAttribute('role','status');app.querySelector('section').append(n)}n.textContent=t}function listen(w){let b=btn('🔊 Beluister: '+w,()=>speak(w));b.className='listen';return b}function settings(){panel('Geluidsinstellingen');[['sound','Geluid bij juiste en foute antwoorden'],['auto','Automatische uitspraak bij nieuwe woorden'],['slow','Trage uitspraak']].forEach(([k,label])=>{let b=btn((state[k]?'✓ ':'○ ')+label,()=>{state[k]=!state[k];save();settings()});b.setAttribute('aria-pressed',String(state[k]))});btn('Test positief geluid',()=>tone(true));btn('Test fout geluid',()=>tone(false));listen('Mbote');audioNotice(voice()?'Lingala-stem gevonden: '+voice().name:'Geen Lingala-stem gevonden. Uitspraak vereist een ondersteunde Lingala-stem.');btn('Terug',home,true)}function home(){window.speechSynthesis?.cancel();stats();panel('Jouw leerpad','<p>Leer vijf nieuwe woorden per les. Geen tijdslimiet of levens.</p>');L.forEach((l,i)=>{let b=btn((state.done.includes(i)?'✓ ':i===0||state.done.includes(i-1)?'● ':'🔒 ')+(i+1)+'. '+l.title,()=>start(i));b.disabled=i>0&&!state.done.includes(i-1)&&!state.done.includes(i)});btn('Herhaal moeilijke woorden ('+Object.keys(state.weak).length+')',review);btn('Woordenboek',dictionary);btn('⚙ Geluidsinstellingen',settings)}function dictionary(){panel('Woordenboek');let s=app.querySelector('section');L.filter((l,i)=>state.done.includes(i)).forEach(l=>{let h=document.createElement('h3');h.textContent=l.title;s.append(h);l.words.forEach(w=>{let p=document.createElement('p');p.textContent=w.join(' — ');s.append(p);listen(w[0])})});btn('Terug',home,true)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(i){lesson=i;pos=0;let w=L[i].words;queue=[...w.map(x=>({type:'learn',w:x})),...shuffle(w).map(x=>({type:'recognize',w:x,pool:w})),...shuffle(w).map(x=>({type:'reverse',w:x,pool:w})),...shuffle(w).map(x=>({type:x[0].includes(' ')?'order':'type',w:x,pool:w}))];show()}function review(){lesson=-1;pos=0;let w=L.flatMap(l=>l.words).filter(x=>state.weak[x[0]]);if(!w.length){panel('Geen moeilijke woorden','<p>Volg eerst een les.</p>');btn('Terug',home,true);return}queue=w.map(x=>({type:'type',w:x}));show()}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim().replace(/ +/g,' ')}function show(){locked=false;chosen=[];if(pos>=queue.length){if(lesson>=0&&!state.done.includes(lesson))state.done.push(lesson);save();panel('Les voltooid! 🎉','<p>Ozali malamu! Blijf regelmatig oefenen.</p>');btn('Naar leerpad',home,true);return}let q=queue[pos],w=q.w;panel(lesson<0?'Herhaling':L[lesson].title,'<progress max="'+queue.length+'" value="'+pos+'"></progress><p><small>Stap '+(pos+1)+' van '+queue.length+'</small></p>');let s=app.querySelector('section');function line(t,cls=''){let p=document.createElement('p');p.textContent=t;p.className=cls;s.append(p)}if(q.type==='learn'){line(w[0],'big');listen(w[0]);if(state.auto)speak(w[0],false);line(w[1]);line(L[lesson].note);btn('Ik heb dit gelezen',next,true)}else if(q.type==='recognize'||q.type==='reverse'){let k=q.type==='recognize'?1:0;line(k?'Wat betekent dit?':'Hoe zeg je dit in Lingala?');line(w[1-k],'big');if(k)listen(w[0]);shuffle([w,...shuffle(q.pool.filter(x=>x!==w)).slice(0,3)]).forEach(x=>btn(x[k],()=>check(x[k],w[k])))}else if(q.type==='order'){line('Zet de woorden in de juiste volgorde');line(w[1],'big');let out=document.createElement('p');s.append(out);shuffle(w[0].split(' ')).forEach(x=>{let b=btn(x,()=>{chosen.push(x);out.textContent=chosen.join(' ');b.disabled=true});b.className='chip'});btn('Opnieuw ordenen',show);btn('Controleren',()=>check(chosen.join(' '),w[0]),true)}else{line('Typ in het Lingala');line(w[1],'big');let inp=document.createElement('input');inp.placeholder='Jouw antwoord';inp.autocomplete='off';s.append(inp);inp.onkeydown=e=>{if(e.key==='Enter')check(inp.value,w[0])};btn('Controleren',()=>check(inp.value,w[0]),true)}btn('Les verlaten',home)}function next(){window.speechSynthesis?.cancel();pos++;show()}function check(a,b){if(locked)return;locked=true;let q=queue[pos],ok=norm(a)===norm(b);app.querySelectorAll('button,input').forEach(x=>x.disabled=true);let p=document.createElement('p');p.className=ok?'good':'bad';p.textContent=ok?'✓ Juist! +10 XP':'Nog even oefenen. Antwoord: '+b;app.querySelector('section').append(p);tone(ok);listen(q.w[0]);if(ok){state.xp+=10;if(q.type==='type'||q.type==='order')delete state.weak[q.w[0]]}else{state.weak[q.w[0]]=true;if(!q.retry)queue.push({...q,retry:true})}save();btn('Verder',next,true)}home();</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(console.warn);</script></html>
