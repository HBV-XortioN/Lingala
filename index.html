function downloadReview(entries,name){let blob=new Blob([JSON.stringify({format:'lingala-review-1',entries},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
function reviewHub(){stopAudio();panel('Review & uitspraak');let p=document.createElement('p');p.textContent=Object.values(effective).filter(e=>e.approved).length+' / '+originals.size+' goedgekeurd · '+Object.values(effective).filter(e=>e.audio&&e.approved).length+' opnames';app.querySelector('section').append(p);btn('Volgend niet-gevalideerd woord',()=>{let i=[...originals.keys()].findIndex(k=>!effective[k]?.approved);editReview(i<0?0:i)} ,true);btn('Alle woorden bekijken',()=>reviewList());btn('Exporteer privé-review (correcties + audio)',()=>downloadReview(personal,'lingala-review.json'));btn('Importeer reviewbestand',()=>{let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{if(!f.files[0])return;if(f.files[0].size>100000000)throw Error('Bestand te groot (max 100 MB)');let e=validate(JSON.parse(await f.files[0].text()));if(!confirm(Object.keys(e).length+' woorden importeren? Bij overlap vervangt het importbestand je lokale review.'))return;await storePersonal({...personal,...e});reviewHub();alert('Import voltooid')}catch(err){alert('Import mislukt: '+err.message)}};f.click()});btn('Exporteer voor GitHub',()=>{if(confirm('Dit bestand bevat goedgekeurde correcties en mogelijk stemopnames. Bij upload naar je publieke GitHub kan iedereen deze downloaden. Heb je toestemming om deze openbaar te maken?'))downloadReview(Object.fromEntries(Object.entries(effective).filter(([k,e])=>e.approved)),'published-reviews.json')});btn('Terug',home,true)}
function reviewList(){panel('Alle woorden');let s=app.querySelector('section'),f=document.createElement('input');f.placeholder='Zoek Lingala of Nederlands';s.append(f);let list=document.createElement('div');s.append(list);function draw(){list.replaceChildren();[...originals.entries()].forEach(([id,w],i)=>{let e=effective[id],t=(e?.ln||w[0])+' — '+(e?.nl||w[1]);if(!t.toLowerCase().includes(f.value.toLowerCase()))return;let b=document.createElement('button');b.textContent=(e?.approved?'✓ ':'○ ')+t+(e?.audio?' 🔊':'');b.onclick=()=>editReview(i);list.append(b)})}f.oninput=draw;draw();btn('Terug',reviewHub)}
function editReview(i){stopAudio();reviewIndex=i;let id=[...originals.keys()][i],w=originals.get(id),e=effective[id]||{};draftAudio=e.audio||'';panel('Woord '+(i+1)+' / '+originals.size);let s=app.querySelector('section');function field(label,value){let l=document.createElement('label');l.textContent=label;let f=document.createElement('input');f.value=value;f.maxLength=1000;l.append(f);s.append(l);return f}let ln=field('Lingala',e.ln||w[0]),nl=field('Nederlands',e.nl||w[1]),alt=field('Alternatieve Lingala-antwoorden (gescheiden door ;)',(e.alternatives||[]).join('; ')),note=field('Opmerking',e.note||'');let select=document.createElement('select');for(let [v,t] of [['beide','Algemeen / beide'],['kinshasa','Dagelijks Kinshasa'],['formeel','Formeel'],['ongebruikelijk','Ongebruikelijk']]){let o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)}select.value=e.register||'beide';s.append(select);let msg=document.createElement('p');s.append(msg);let play=btn('▶ Beluister eigen opname',()=>{stopAudio();player=new Audio(draftAudio);player.play().catch(()=>alert('Opname kan niet afspelen'))});let del=btn('Verwijder opname',()=>{draftAudio='';refresh()});function refresh(){play.disabled=del.disabled=!draftAudio;msg.textContent=draftAudio?'Eigen opname aanwezig':'Nog geen eigen opname'}refresh();let record=btn('🎙 Opname starten',async()=>{if(recording)return;record.disabled=true;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Microfoonopname niet ondersteund');stream=await navigator.mediaDevices.getUserMedia({audio:true});let mime=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);let chunks=[];recording=true;controls(true);rec.ondataavailable=x=>{if(x.data.size)chunks.push(x.data)};rec.onstop=()=>{clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());let reader=new FileReader();reader.onload=()=>{draftAudio=String(reader.result);recording=false;controls(false);refresh()};reader.onerror=()=>{recording=false;controls(false);alert('Opname lezen mislukt')};reader.readAsDataURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'}))};rec.start();let timer=setTimeout(()=>{if(rec.state==='recording')rec.stop()},20000);msg.textContent='Opname bezig (max. 20 seconden)…'}catch(err){stream?.getTracks().forEach(t=>t.stop());recording=false;controls(false);alert(err.message)}});let stop=btn('■ Stop opname',()=>{if(rec?.state==='recording')rec.stop()});stop.disabled=true;async function persist(approved){try{let entry={ln:ln.value.trim(),nl:nl.value.trim(),alternatives:alt.value.split(';').map(x=>x.trim()).filter(Boolean),note:note.value,register:select.value,approved,audio:draftAudio};let clean=validate({format:'lingala-review-1',entries:{[id]:entry}});await storePersonal({...personal,...clean});if(i+1<originals.size)editReview(i+1);else reviewHub()}catch(err){alert('Opslaan mislukt: '+err.message)}}let approve=btn('✓ Opslaan & goedkeuren',()=>persist(true),true),draft=btn('Bewaar als concept',()=>persist(false)),prev=btn('Vorige',()=>editReview(i-1)),nextB=btn('Volgende (zonder opslaan)',()=>editReview(i+1)),back=btn('Terug',reviewHub);function controls(on){for(let b of [record,play,del,approve,draft,prev,nextB,back])b.disabled=on;stop.disabled=!on;if(!on){prev.disabled=i===0;nextB.disabled=i===originals.size-1;refresh()}}controls(false)}
async function initReviews(){try{personal=await dbGet('personal')||{};published=await dbGet('published')||{}}catch(e){console.warn(e)}applyReviews();home();try{let r=await fetch('./published-reviews.json',{cache:'no-store'});if(r.ok){let p=validate(await r.json());published=p;applyReviews();try{await dbPut('published',p)}catch(e){}if(document.querySelector('#app h2')?.textContent==='Jouw leerpad')home()}}catch(e){console.warn('Public reviews unavailable',e)}}

initReviews();</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(console.warn);</script></html>
